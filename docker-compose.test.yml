version: '3.8'

services:
  test-db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=testdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  test-redis:
    image: "redis:alpine"
    ports:
      - "6380:6379"

volumes:
  postgres_test_data: