version: '3.8'

services:
  test-db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=testdb
    ports:
      - "5435:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - ia_n8n_network

  test-redis:
    image: "redis:alpine"
    ports:
      - "6380:6379"
    networks:
      - ia_n8n_network

networks:
  ia_n8n_network:
    driver: bridge

volumes:
  postgres_test_data: