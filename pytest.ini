[pytest]
asyncio_mode = auto
markers =
    integration: mark a test as an integration test.

# Configurações de Log para o Pytest
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)-25s | %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

[pytest-asyncio]
# Use a new event loop for each test to ensure isolation
# This helps prevent resource leaks between tests
loop_on_fixture_teardown = true
