[pytest]
addopts = -s -v
asyncio_mode = auto
markers =
    integration: mark a test as an integration test.

# Configurações de Log para o Pytest
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)-25s | %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configurações para salvar log em arquivo
log_file = tests_2.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)-25s | %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S